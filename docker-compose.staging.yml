# Smart-Corp AI — SELF-HOSTED staging reference (all open-source, $0).
# This is the fully self-hosted alternative to the free-managed path
# (Neon + Cloudflare R2 + hosted Keycloak). Either path works; this one needs
# no external account beyond Docker. All credentials are local-only placeholders —
# inject real secrets via the platform secret manager in production.
#
#   postgres  — PostgreSQL 16 (RLS, migrations)
#   minio     — S3-compatible object storage (SSE-S3)
#   clamav    — malware scanning (clamd)
#   keycloak  — OIDC identity provider (open-source)
#   migrate   — one-shot migration runner
#   api       — Smart-Corp application
#   worker    — durable document-processing worker
#   prometheus/grafana — observability (metrics + dashboards)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_corp
      POSTGRES_USER: smart_corp
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_corp -d smart_corp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/smart-corp-documents &&
      mc encrypt set sse-s3 local/smart-corp-documents || true"

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes: [clamav-db:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: local-only-change-me
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: smart_corp
      KC_DB_PASSWORD: local-only-change-me
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  migrate:
    build: .
    command: ["node", "--import", "tsx", "server/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
      DATABASE_SSL: "false"
      DATABASE_POOL_SIZE: "20"
      DEV_AUTH_BYPASS: "false"
      SESSION_SECRET: local-only-change-me
      OIDC_ISSUER: http://localhost:8080/realms/smart-corp
      OIDC_CLIENT_ID: smart-corp-api
      OIDC_CLIENT_SECRET: local-only-change-me
      OIDC_REDIRECT_URI: http://localhost:3001/api/auth/oidc/callback
      OIDC_TENANT_CLAIM: tenant_id
      OIDC_ROLES_CLAIM: roles
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: smart-corp-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER_PROVIDER: clamav
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["3001:3001"]

  worker:
    build: .
    command: ["node", "--import", "tsx", "server/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
      DATABASE_POOL_SIZE: "10"
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: smart-corp-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER_PROVIDER: clamav
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  minio-data:
  clamav-db:
