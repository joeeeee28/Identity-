# Prometheus configuration for Smart-Corp AI staging.
# Scrapes the API's /metrics endpoint and evaluates alert-rules.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: smart-corp-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3001']
  - job_name: smart-corp-worker
    # The worker exposes no HTTP endpoint today; its queue telemetry is
    # recorded by the API process and surfaced via the queue_* metrics above.
    static_configs:
      - targets: ['api:3001']
