services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_corp
      POSTGRES_USER: smart_corp
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
      DEV_AUTH_BYPASS: "false"
      STORAGE_PROVIDER: s3
      MALWARE_SCANNER_PROVIDER: required
      SESSION_SECRET: local-only-change-me
    depends_on:
      - postgres
    ports:
      - "3001:3001"
volumes:
  postgres-data:
