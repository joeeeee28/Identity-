# Smart-Corp AI — staging infrastructure (local Docker).
# Mirrors the production architecture: PostgreSQL (RLS), MinIO (S3-compatible
# encrypted object storage), ClamAV (malware scanning), the API and a dedicated
# durable worker process. Credentials below are local-only placeholders; real
# deployments inject secrets through the platform secret manager, never here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_corp
      POSTGRES_USER: smart_corp
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_corp -d smart_corp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/smart-corp-documents &&
      mc encrypt set sse-s3 local/smart-corp-documents || true
      "

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5

  migrate:
    build: .
    command: ["node", "--import", "tsx", "server/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
      DATABASE_SSL: "false"
      DEV_AUTH_BYPASS: "false"
      SESSION_SECRET: local-only-change-me
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: smart-corp-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER_PROVIDER: clamav
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  worker:
    build: .
    command: ["node", "--import", "tsx", "server/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smart_corp:local-only-change-me@postgres:5432/smart_corp
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: smart-corp-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER_PROVIDER: clamav
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  clamav-db:
